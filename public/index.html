<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <title>YT Watch Party</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">▶</span><span>YT Watch Party</span></div>
      <div class="top-actions"><button id="installBtn" class="ghost hidden">Install</button><button id="leaveBtn" class="ghost hidden">Leave</button></div>
    </header>

    <main>
      <section id="homeScreen" class="screen">
        <div class="hero">
          <div class="eyebrow">WATCH TOGETHER</div>
          <h1>YouTube, but together.</h1>
          <p>Create a private party, share the code, and keep everyone's playback in sync.</p>
        </div>

        <div class="card entry-card">
          <label>Your name</label>
          <input id="nameInput" maxlength="24" placeholder="e.g. Dhruv" autocomplete="name">

          <div class="divider"><span>Start a party</span></div>
          <button id="createBtn" class="primary">Create Party</button>

          <div class="divider"><span>Join a party</span></div>
          <div class="join-row">
            <input id="codeInput" maxlength="6" placeholder="ABC123" autocapitalize="characters">
            <button id="joinBtn" class="secondary">Join</button>
          </div>
          <p id="homeError" class="error"></p>
        </div>
      </section>

      <section id="partyScreen" class="screen hidden">
        <div class="party-head">
          <div>
            <div class="eyebrow">PARTY CODE</div>
            <div class="code-line"><button id="copyCodeBtn" class="code">------</button><button id="shareBtn" class="share-button">Share</button></div>
            <div id="connectionStatus" class="connection"><span></span> Connected</div>
          </div>
          <div id="roleBadge" class="badge">Guest</div>
        </div>

        <div class="player-wrap">
          <div id="player"></div>
          <div id="playerPlaceholder" class="player-placeholder">
            <div class="play-icon">▶</div>
            <p>Ask the host to load a YouTube video.</p>
          </div>
        <div id="syncBadge" class="sync-badge hidden">Synced</div></div>
        <div id="hostControls" class="card host-controls hidden">
          <div class="control-title">Host controls</div>
          <div class="video-row">
            <input id="videoInput" placeholder="Paste a YouTube URL or video ID">
            <button id="loadBtn" class="primary small">Load</button>
          </div>
          <div class="host-buttons">
            <button id="playBtn" class="secondary">▶ Play</button>
            <button id="pauseBtn" class="secondary">Ⅱ Pause</button>
            <button id="syncBtn" class="secondary">↻ Sync</button>
          </div>
        </div>

        <div class="toolbar card"><div><strong id="partyTitle">Party</strong> <span id="memberSummary">0 people</span></div><button id="renameBtn" class="secondary small">Rename</button></div>

        <div class="grid">
          <section class="card">
            <div class="section-title"><span>People</span><span id="count">0</span></div>
            <div id="participants" class="participants"></div>
          </section>

          <section class="card chat-card">
            <div class="section-title">Chat</div>
            <div id="messages" class="messages"></div>
            <form id="chatForm" class="chat-form">
              <input id="chatInput" maxlength="500" placeholder="Say something…">
              <button class="primary small" type="submit">Send</button>
            </form>
          </section>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="/app.js"></script>
</body>
</html>
